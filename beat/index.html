<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YBK Beat Sketch</title>
<meta name="description" content="Describe a beat, hear it in seconds, make it yours. Free, in your browser, no install.">
<style>
:root{
  --bg:#0f1012; --panel:#17191c; --panel2:#1f2226; --line:#2b2f34; --text:#eceae6; --muted:#9a9890;
  --accent:#f2a33a; --accent2:#ffcf87; --on:#f2a33a; --ghost:#7a5a2c; --play:#ffffff22;
  color-scheme:dark;
  --kick:#f2a33a; --snare:#e8775c; --clap:#e45f86; --hat:#c8c35a; --ohat:#9ac85a; --perc:#5ac8a5; --bass:#5a9ac8; --keys:#a58ae0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{font-weight:700;letter-spacing:.04em}
.brand span{color:var(--accent)}
.lang{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--muted)}
h1{font-size:clamp(26px,5vw,40px);line-height:1.15;margin:0 0 8px;font-weight:750;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px}
.prompt{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.prompt input{flex:1;min-width:0;background:none;border:0;outline:none;padding:10px 8px;font-size:17px}
.btn{border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--panel2);font-weight:600}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--accent);color:#1a1206}
.btn.small{padding:6px 12px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--muted);font-size:14px}
.chip:hover{color:var(--text);border-color:var(--muted)}
#resume{margin-top:14px}
#studio{display:none;margin-top:26px}
.heard{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px;color:var(--muted);font-size:14px}
.tag{background:var(--panel2);color:var(--text);border-radius:6px;padding:2px 8px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.bar label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.bar select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 6px}
.bar input[type=range]{width:90px;accent-color:var(--accent)}
.val{min-width:2.4em;color:var(--text);font-variant-numeric:tabular-nums}
#play{width:46px;height:46px;border-radius:50%;padding:0;font-size:18px}
.grow{flex:1}
.chords{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 8px}
.chord{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.chord.now{border-color:var(--keys)}
.chord small{display:block;color:var(--muted);font-size:12px}
.chord b{font-size:18px}
.chord select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.gridwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.grid{display:grid;grid-template-columns:150px repeat(16,minmax(26px,1fr));gap:4px;min-width:660px}
.rowlab{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;position:sticky;left:0;z-index:1;background:var(--panel);padding-right:4px}
.rowlab .name{flex:1;overflow:hidden;text-overflow:ellipsis}
.rowlab .dot{width:8px;height:8px;border-radius:50%;flex:none}
.rowlab .name{cursor:default}
.rowlab .name.cyc{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.mute{border:1px solid var(--line);background:none;border-radius:5px;width:22px;height:20px;font-size:11px;cursor:pointer;color:var(--muted);padding:0}
.mute.on{background:#c0392b;color:#fff;border-color:#c0392b}
.vol{width:44px;accent-color:var(--muted)}
.cell{height:30px;border-radius:5px;background:var(--panel2);border:0;cursor:pointer;padding:0}
.cell.beat{background:#262a2f}
.cell.on{background:var(--c)}
.cell.ghost{background:color-mix(in srgb,var(--c) 40%,var(--panel2))}
.cell.playing{outline:2px solid #fff8;outline-offset:-2px}
.row-muted .cell.on,.row-muted .cell.ghost{opacity:.3}
.song{display:flex;gap:4px;margin:14px 0 0;align-items:stretch}
.sec{flex:var(--n);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap}
.sec.now{border-color:var(--accent);color:var(--text)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.note{color:var(--muted);font-size:13px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.loading{color:var(--muted);font-size:14px;margin-top:10px;min-height:1.4em}
@media (max-width:600px){ .chords{grid-template-columns:repeat(2,1fr)} .prompt{flex-wrap:wrap} .prompt .btn{width:100%} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">YBK <span>Beat Sketch</span></div>
    <button class="lang" id="lang">한국어</button>
  </header>

  <h1 data-t="h1">Describe a beat. Hear it now. Make it yours.</h1>
  <p class="sub" data-t="sub">Free, in your browser, nothing to install. Every sound is a YBK AUDIO sample.</p>

  <form class="prompt" id="form">
    <input id="q" autocomplete="off" maxlength="200">
    <button class="btn primary" id="go" type="submit" data-t="make">Make a beat</button>
  </form>
  <div class="chips" id="examples"></div>
  <div id="resume"></div>
  <div class="loading" id="loading"></div>

  <section id="studio">
    <div class="heard" id="heard"></div>
    <div class="bar">
      <button class="btn primary" id="play" aria-label="Play">▶</button>
      <label><span data-t="tempo">Tempo</span> <input type="range" id="bpm" min="60" max="180"><span class="val" id="bpmv"></span></label>
      <label><span data-t="swing">Swing</span> <input type="range" id="swing" min="0" max="50"><span class="val" id="swingv"></span></label>
      <label><span data-t="kit">Kit</span> <select id="kit"></select></label>
      <label><span data-t="key">Key</span> <select id="root"></select><select id="mode"></select></label>
      <label><input type="checkbox" id="vinyl"> <span data-t="vinyl">Vinyl</span></label>
      <span class="grow"></span>
      <label><select id="playmode"></select></label>
    </div>

    <div class="chords" id="chords"></div>
    <div class="gridwrap"><div class="grid" id="grid"></div></div>
    <div class="song" id="song"></div>

    <div class="actions">
      <button class="btn" id="again" data-t="again">Try another</button>
      <button class="btn" id="share" data-t="share">Copy link</button>
      <span class="grow"></span>
      <button class="btn" id="expLoop" data-t="expLoop">Download loop (WAV)</button>
      <button class="btn primary" id="expSong" data-t="expSong">Download full track (WAV)</button>
    </div>
    <p class="note" data-t="own">What you make here is yours. Use it in releases, videos and streams, royalty free.</p>
  </section>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
