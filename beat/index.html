<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YBK Beat Sketch</title>
<meta name="description" content="Describe a beat, hear it in seconds, make it yours. Free, in your browser, no install.">
<style>
:root{
  --bg:#0f1012; --panel:#17191c; --panel2:#1f2226; --line:#2b2f34; --text:#eceae6; --muted:#9a9890;
  --accent:#f2a33a; --accent2:#ffcf87; --on:#f2a33a; --ghost:#7a5a2c; --play:#ffffff22;
  color-scheme:dark;
  --kick:#f2a33a; --snare:#e8775c; --clap:#e45f86; --hat:#c8c35a; --ohat:#9ac85a; --perc:#5ac8a5; --bass:#5a9ac8; --keys:#a58ae0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{font-weight:700;letter-spacing:.04em}
.brand span{color:var(--accent)}
.lang{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--muted)}
h1{text-wrap:balance;font-size:clamp(26px,5vw,40px);line-height:1.15;margin:0 0 8px;font-weight:750;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px}
.prompt{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.prompt input{flex:1;min-width:0;background:none;border:0;outline:none;padding:10px 8px;font-size:17px}
.btn{border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--panel2);font-weight:600}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--accent);color:#1a1206}
.btn.small{padding:6px 12px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--muted);font-size:14px}
.chip:hover{color:var(--text);border-color:var(--muted)}
#resume{margin-top:14px}
#studio{display:none;margin-top:26px}
.heard{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px;color:var(--muted);font-size:14px}
.tag{background:var(--panel2);color:var(--text);border-radius:6px;padding:2px 8px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.bar label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.bar select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 6px}
.bar input[type=range]{width:90px;accent-color:var(--accent)}
.val{min-width:2.4em;color:var(--text);font-variant-numeric:tabular-nums}
#play{width:46px;height:46px;border-radius:50%;padding:0;font-size:18px}
.grow{flex:1}
.chords{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 8px}
.chord{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.chord.now{border-color:var(--keys)}
.chord small{display:block;color:var(--muted);font-size:12px}
.chord b{font-size:18px}
.chord select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.gridwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.grid{display:grid;grid-template-columns:194px repeat(16,minmax(26px,1fr)) auto;gap:4px;min-width:840px}
.rowlab{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;position:sticky;left:0;z-index:1;background:var(--panel);padding-right:4px}
.rowlab .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.rowlab .name small{display:block;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.rowtools{display:flex;gap:3px;align-items:center;padding-left:4px}
.tool{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--muted)}
.tool:hover{color:var(--text);border-color:var(--muted)}
.tool svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chordhead{display:flex;align-items:center;gap:10px;margin:14px 0 0;color:var(--muted);font-size:14px}
.chordhead + .chords{margin-top:8px}
body.noscroll{overflow:hidden}
#browser{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto}
.brbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px}
.brrow{max-width:980px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brrow h2{margin:0;font-size:18px;flex:1;min-width:160px}
.switch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 12px 6px 8px;cursor:pointer;font-weight:600}
.switch i{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;flex:none}
.switch i::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:left .15s}
.switch[aria-pressed=true] i{background:var(--accent)}
.switch[aria-pressed=true] i::after{left:14px;background:#1a1206}
.brhint{max-width:980px;margin:8px auto 0;color:var(--muted);font-size:13px}
.brbody{max-width:980px;margin:0 auto;padding:14px 16px 60px}
.brgenres{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip.sel{background:var(--accent);color:#1a1206;border-color:var(--accent)}
.brlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.item{display:flex;align-items:center;gap:8px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;min-width:0}
.item span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--muted);font-size:11px}
.item .play{color:var(--accent);font-size:11px}
.item.sel{border-color:var(--accent);background:var(--panel2)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.rowlab .dot{width:8px;height:8px;border-radius:50%;flex:none}
.rowlab .name{cursor:default}
.rowlab .name.cyc{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.mute{border:1px solid var(--line);background:none;border-radius:5px;width:22px;height:20px;font-size:11px;cursor:pointer;color:var(--muted);padding:0}
.mute.on{background:#c0392b;color:#fff;border-color:#c0392b}
.mute.solo.on{background:var(--hat);color:#1a1606;border-color:var(--hat)}
.vol{width:44px;accent-color:var(--muted)}
.cell{height:30px;border-radius:5px;background:var(--panel2);border:0;cursor:pointer;padding:0}
.cell.beat{background:#262a2f}
.cell.on{background:var(--c)}
.cell.ghost{background:color-mix(in srgb,var(--c) 40%,var(--panel2))}
.cell.playing{outline:2px solid #fff8;outline-offset:-2px}
.row-muted .cell.on,.row-muted .cell.ghost{opacity:.3}
.song{display:flex;gap:4px;margin:14px 0 0;align-items:stretch}
.sec{flex:var(--n);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap}
.sec.now{border-color:var(--accent);color:var(--text)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.note{color:var(--muted);font-size:13px;margin-top:18px}
.tool.del:hover{color:#e8775c;border-color:#e8775c}
.addrow{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin-top:2px}
.addbtn{height:32px;border:1px dashed var(--line);border-radius:6px;background:none;color:var(--muted);cursor:pointer;font-weight:600;text-align:left;padding:0 12px;position:sticky;left:0}
.addbtn:hover,.addbtn[aria-expanded=true]{color:var(--text);border-color:var(--muted)}
.addbtn span{font-size:18px;margin-right:4px}
.addmenu{display:flex;flex-wrap:wrap;gap:6px;position:sticky;left:0;max-width:calc(100vw - 64px)}
.addmenu .chip{display:flex;align-items:center;gap:6px;color:var(--text)}
.addmenu .dot{width:8px;height:8px;border-radius:50%}
.chip small{color:inherit;opacity:.6;font-size:11px}
.toast.act{pointer-events:auto;display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:0}
.gridhint{margin:6px 2px 0;color:var(--muted);font-size:12px}
.toast{z-index:30;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.loading{color:var(--muted);font-size:14px;margin-top:10px;min-height:1.4em}
@media (max-width:600px){ .chords{grid-template-columns:repeat(2,1fr)} .prompt{flex-wrap:wrap} .prompt .btn{width:100%} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">YBK <span>Beat Sketch</span></div>
    <button class="lang" id="lang">한국어</button>
  </header>

  <h1 data-t="h1">Describe a beat. Hear it now. Make it yours.</h1>
  <p class="sub" data-t="sub">Free, in your browser, nothing to install. Every sound is a YBK AUDIO sample.</p>

  <form class="prompt" id="form">
    <input id="q" autocomplete="off" maxlength="200">
    <button class="btn primary" id="go" type="submit" data-t="make">Make a beat</button>
  </form>
  <div class="chips" id="examples"></div>
  <div id="resume"></div>
  <div class="loading" id="loading"></div>

  <section id="studio">
    <div class="heard" id="heard"></div>
    <div class="bar">
      <button class="btn primary" id="play" aria-label="Play">▶</button>
      <label><span data-t="tempo">Tempo</span> <input type="range" id="bpm" min="60" max="180"><span class="val" id="bpmv"></span></label>
      <label><span data-t="swing">Swing</span> <input type="range" id="swing" min="0" max="50"><span class="val" id="swingv"></span></label>
      <label><span data-t="kit">Kit</span> <select id="kit"></select></label>
      <label><span data-t="key">Key</span> <select id="root"></select><select id="mode"></select></label>
      <label><input type="checkbox" id="vinyl"> <span data-t="vinyl">Vinyl</span></label>
      <span class="grow"></span>
      <label><select id="playmode"></select></label>
    </div>

    <div class="chordhead"><span data-t="progs">Chords</span><button class="btn small" id="newProg" data-t="newProg">New chord progression</button></div>
    <div class="chords" id="chords"></div>
    <div class="gridwrap"><div class="grid" id="grid"></div></div>
    <p class="gridhint" data-t="cellTip">Click: note on/off · Right-click: soft note</p>
    <div class="song" id="song"></div>

    <div class="actions">
      <button class="btn" id="again" data-t="again">Try another</button>
      <button class="btn" id="share" data-t="share">Copy link</button>
      <span class="grow"></span>
      <button class="btn" id="expLoop" data-t="expLoop">Download loop (WAV)</button>
      <button class="btn primary" id="expSong" data-t="expSong">Download full track (WAV)</button>
    </div>
    <p class="note" data-t="own">What you make here is yours. Use it in releases, videos and streams, royalty free.</p>
  </section>
</div>
<input type="file" id="file" accept="audio/*,.wav,.mp3,.aif,.aiff,.flac,.ogg,.m4a" hidden>
<div id="browser" hidden role="dialog" aria-modal="true" aria-labelledby="brTitle">
  <div class="brbar">
    <div class="brrow">
      <h2 id="brTitle">YBK Beats</h2>
      <button class="switch" id="brPreview" aria-pressed="true"><i></i><span></span></button>
      <button class="btn primary small" id="brUse" data-t="useThis">Use this sound</button>
      <button class="btn small" id="brClose" data-t="cancel">Cancel</button>
    </div>
    <p class="brhint" id="brHint"></p>
  </div>
  <div class="brbody">
    <div class="brgenres" id="brGenres"></div>
    <div class="brlist" id="brList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
